name: build-gaokao-master
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fetch source assets
        run: |
          git clone --depth 1 https://github.com/DxAThing/Gaokao-Math-Problems-Compilation.git gaokao_retypeset_2020_2025/vendor/upstream
      - name: Build with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: gaokao_retypeset_2020_2025
          latexmk_use_xelatex: true
          args: -pdfxe -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Commit compiled PDF to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaokao_retypeset_2020_2025/main.pdf
          git commit -m "Build 2020-2025 Gaokao retypeset PDF" || exit 0
          git push origin HEAD:master
